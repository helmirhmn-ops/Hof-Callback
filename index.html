<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm py-2 px-4">
      <div class="container-fluid">
        <a
          class="navbar-brand fw-semibold d-flex align-items-center gap-2 fs-6"
          href="#"
        >
          <i class="bi bi-mortarboard-fill fs-5"></i>
          <span>Student Dashboard</span>
        </a>
      </div>
    </nav>

    <main class="container my-4">
      <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <!-- Header & Search Input -->
        <div
          class="card-header bg-white py-3 px-4 border-bottom d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3"
        >
          <h6 class="mb-0 text-primary fw-bold">Daftar Nilai Siswa</h6>

          <div class="input-group search-box">
            <span class="input-group-text bg-light border-end-0 text-muted">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              id="searchInput"
              class="form-control border-start-0 ps-1"
              placeholder="Cari nama siswa..."
              aria-label="Cari nama siswa"
            />
          </div>
        </div>

        <!-- Tabel Data Siswa -->
        <div class="table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col" class="text-center" style="width: 8%">No</th>
                <th scope="col" style="width: 42%">Nama Siswa</th>
                <th scope="col" class="text-center" style="width: 25%">
                  Kelas
                </th>
                <th scope="col" class="text-center" style="width: 25%">
                  Nilai (Score)
                </th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <!-- Data dirender otomatis oleh JavaScript (.map) -->
            </tbody>
          </table>
        </div>

        <!-- Footer -->
        <div
          class="card-footer bg-white py-3 px-4 border-top d-flex justify-content-end align-items-center gap-2"
        >
          <span class="text-secondary fw-medium">Rata-rata Nilai Kelas:</span>
          <span
            id="averageScore"
            class="badge bg-primary fs-6 px-3 py-2 rounded-2"
            >0.0</span
          >
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
